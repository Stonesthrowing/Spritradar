name: Spritradar Tankplan (manuell)

# KEIN Zeitplan. Die Nachricht kommt auf Zuruf: „go" im Telegram-Chat
# (beantwortet der Poller in bot.yml). Dieser Workflow ist nur der
# Notnagel/Testweg über die GitHub-Oberfläche: Actions -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Spritradar senden
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: "1"   # manueller Start -> immer senden
        run: python -m spritradar.main

      - name: Aktualisierte Preishistorie committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "Keine Änderung an der Historie."
          else
            git commit -m "chore: Preishistorie aktualisieren ($(date -u +%F))"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "$BRANCH" && git push && break || sleep 3
            done
          fi
