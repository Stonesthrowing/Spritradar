name: Spritradar Bot

# Lauscher auf „go" / „graphs" im Telegram-Chat – ohne Mini-PC.
#
# WARUM EIN LAUSCHER STATT KURZER POLLS?
# GitHub drosselt geplante Laeufe brutal: Der frühere Poller stand auf
# cron "*/10" (144 geplante Laeufe/Tag) – real ausgeliefert wurden am 24.07.2026
# genau DREI, im Abstand von ~2 h. Ein kurzer Poll pro Lauf hiesse also bis zu
# 2 h Wartezeit auf „go".
#
# Deshalb bleibt der Lauf, der durchkommt, per Telegram-Long-Polling offen
# (POLL_SECONDS) und antwortet in Sekunden. Die concurrency-Gruppe sorgt dafuer,
# dass immer nur EIN Lauscher lebt; der naechste geplante Lauf wartet in der
# Warteschlange und uebernimmt nahtlos, sobald der laufende endet.
#
# Nachtruhe: Die Crons decken 03:00–20:00 UTC ab (05:00–22:00 Ortszeit im
# Sommer). Ein „go" mitten in der Nacht wird beantwortet, sobald morgens der
# erste Lauscher startet.

on:
  schedule:
    - cron: "*/30 3-20 * * *"
  workflow_dispatch:
    inputs:
      poll_seconds:
        description: "Wie lange lauschen (Sekunden). 0 = einmal nachsehen."
        default: "7200"

permissions:
  contents: write

# Kein cancel-in-progress: Ein laufender Lauscher darf nicht abgeschossen
# werden. Neue Laeufe warten und uebernehmen danach.
concurrency:
  group: spritradar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Etwas mehr als POLL_SECONDS, damit der Job selbst sauber endet und nicht
    # von GitHub hart abgeschnitten wird.
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Auf „go" / „graphs" lauschen
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POLL_SECONDS: ${{ github.event.inputs.poll_seconds || '7200' }}
        run: python -m spritradar.bot

      - name: Bot-Status und Historie committen
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bot_state.json data/history.json data/intraday.json
          if git diff --cached --quiet; then
            echo "Keine Änderung."
          else
            git commit -m "chore: Bot-Offset/Historie aktualisieren"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "$BRANCH" && git push && break || sleep 3
            done
          fi
